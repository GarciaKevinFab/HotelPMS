    <script>
        window.addEventListener(
            "error",
            function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            },
            true
        );
    </script>
    <style>
        @keyframes badge-dot-pulse {

            100% {

            }

            50% {
                box-shadow: 0 0 0 5px rgba(74, 222, 128, 0.07);
            }
        }

        #brand-badge-dot {
            animation: badge-dot-pulse 2.4s ease-in-out infinite;
        }

        </span>
        <!-- Status dot (animado via CSS) -->
        <span id="brand-badge-dot" style="
            width: 7px !important;
            height: 7px !important;
            border-radius: 50% !important;
            background: #4ade80 !important;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.2) !important;
            flex-shrink: 0 !important;
        "></span>
    </a>
    <!-- Service Worker Registration -->
    <script>
